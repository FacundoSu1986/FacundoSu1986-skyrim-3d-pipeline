# Tipos (issue #72 del repo). Lo corre el CI:
#
#   python -m mypy
#
# Primera pasada: pipeline/ y census/. Los scripts de las skills, fixtures/ y
# tests/ todavia no: se agregan a `files` cuando pasen. La version esta fijada
# en requirements-dev.txt.
#
# numpy, en cambio, no esta fijado (requirements.txt), y sus tipos se afinan de
# una version a otra: numpy 2.5 tipa la forma de los arrays, y un array que
# cambia de forma (`reshape`) necesita otro nombre. Si una version nueva de
# numpy pone rojo este paso, es un aviso de tipos; si cambio el comportamiento,
# lo dice la suite.
[mypy]
files = pipeline,census
# census/, fixtures/ y los scripts de modelo-ia-a-skyrim no son paquetes: el
# codigo los importa agregandolos a sys.path. Aca las rutas van separadas con
# comas en cualquier sistema (la variable MYPYPATH, en cambio, usa `;` en
# Windows, y con comas encuentra solo la primera).
mypy_path = census,fixtures,skills/modelo-ia-a-skyrim/scripts
# Sin esto mypy no revisa el cuerpo de una funcion sin anotaciones, que en
# census/ son casi todas: "0 errores" seria no haber comprobado nada.
check_untyped_defs = True
warn_unused_ignores = True
warn_redundant_casts = True

# Codigo de antes de mypy con 43 contenedores vacios sin anotar (`Counter()`,
# `defaultdict(list)`, `[]`). Anotarlos es forzar type hints, el no-objetivo
# del issue #72 del repo; el resto de su cuerpo SI se revisa. La lista esta
# enumerada, no es un patron: un modulo nuevo no entra solo.
[mypy-agregados,compresor_dxt,generar_reporte,parser_colision,parser_dds,parser_esm,parser_nif,parser_plugin,parser_uv,verificar]
disable_error_code = var-annotated
