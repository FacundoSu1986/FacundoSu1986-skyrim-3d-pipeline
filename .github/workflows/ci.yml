name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # numpy: el bake de la capa HD (hornear.py) corre en Blender, que trae
      # numpy, y usa las funciones de horneado_puro.py que lo necesitan
      # (margen, relleno, reduccion); census/compresor_dxt.py tambien. Sin
      # numpy en CI sus autotests salteaban y decian "OK".
      # Pillow: solo como ORACULO de compresor_dxt (su decodificador y su
      # compresor DXT, para comparar). No es dependencia del repo.
      # tests/test_horneado_puro.py y tests/test_compresor_dxt.py fallan si
      # falta alguno.
      # ruff y mypy: el lint y los tipos de abajo, con la version fijada.
      # La lista vive en requirements-dev.txt (numpy via requirements.txt): el
      # CI instala ESE archivo para que lo declarado y lo probado no se separen.
      - name: numpy, Pillow, ruff y mypy (requirements-dev.txt)
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      # Sintaxis de TODOS los scripts, incluidos los de Blender (medir_parte,
      # preparar_parte): compileall no ejecuta los imports, así que valida su
      # sintaxis aunque `bpy` no exista en el runner.
      - name: Syntax check (compileall)
        run: python -m compileall -q census skills tests pipeline fixtures

      # Lint: E y F (nombres sin definir, imports y variables sin usar,
      # sintaxis) sobre TODOS los .py, tambien los de Blender, porque ruff no
      # importa nada. Las reglas que quedan afuera, y por que, en ruff.toml.
      - name: Lint (ruff)
        run: python -m ruff check .

      # Tipos: pipeline/ y census/, con el cuerpo de las funciones sin
      # anotaciones incluido (check_untyped_defs). Lo que todavia no mira, en
      # mypy.ini. Issue #72 del repo.
      - name: Tipos (mypy)
        run: python -m mypy

      # Cada skill empaquetada con build_skill.py, extraida lejos del repo:
      # sus scripts tienen que importar y pasar su --autotest SIN census/ ni
      # nada de afuera, como le llegan a quien la instala. Tambien corre dentro
      # de "Unit tests"; este paso existe para que se vea con nombre propio.
      - name: Skills empaquetadas (build_skill.py)
        run: python -m unittest tests.test_skill_empaquetada -v

      # Tests de Python puro: import smoke, invariantes de tablas, funciones
      # puras, y la ida y vuelta contra un NIF sintetico construido byte a byte
      # (tests/nif_sintetico.py) -- eso ultimo ejecuta el camino de parseo real
      # sin necesitar el corpus vanilla.
      #
      # Sigue sin cubrirse: los layouts de geometria, skin y colision, que solo
      # se validan con `python census/parser_nif.py --autotest <corpus>` en una
      # maquina que tenga el juego extraido; y los scripts de Blender, que no se
      # pueden importar sin `bpy` (de ahi el compileall de arriba).
      #
      # NO se usa `-W error::ResourceWarning` para detectar fugas de
      # descriptor: no funciona y da una sensacion falsa de seguridad. El aviso
      # lo emite el destructor del objeto archivo, y una excepcion lanzada ahi
      # queda "unraisable": imprime un traceback pero el proceso sale 0 y
      # unittest reporta ok. Verificado en 3.11 con un test que hace
      # `open(__file__, "rb").read()`.
      #
      # Las fugas se comprueban en SinFugasDeDescriptorTests, que fuerza la
      # recoleccion con el filtro activo y afirma sobre lo capturado -- y trae
      # su propio test de que el detector detecta.
      - name: Unit tests
        run: python -m unittest discover -s tests -v
